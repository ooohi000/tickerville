<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 링크 미리보기 이미지 원본 (1200×630). 다시 만들기: python3 scripts/og/render.py → src/app/opengraph-image.png -->
<style>
@font-face { font-family: "Black Han Sans"; src: url("../../public/fonts/BlackHanSans.woff") format("woff"); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 1200px; height: 630px; overflow: hidden; background: #060d16; font-family: "Black Han Sans", sans-serif; color: #e6f4ff; }
.wrap { position: relative; width: 1200px; height: 630px; padding: 64px 72px;
  background:
    radial-gradient(ellipse at 80% 110%, rgba(79,216,255,0.22), transparent 55%),
    linear-gradient(rgba(79,216,255,0.06) 1px, transparent 1px) 0 0 / 40px 40px,
    linear-gradient(90deg, rgba(79,216,255,0.06) 1px, transparent 1px) 0 0 / 40px 40px,
    #060d16; }
.eyebrow { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 22px; letter-spacing: 0.4em; color: #4fd8ff; }
h1 { margin-top: 18px; font-size: 150px; font-weight: 400; line-height: 1; letter-spacing: 0.02em; }
h2 { margin-top: 18px; font-size: 52px; font-weight: 400; color: #ffffff; }
.sub { margin-top: 26px; display: inline-block; padding: 10px 20px; border-radius: 999px; background: #f5c542; color: #1b2430; font-size: 30px; }
.foot { position: absolute; left: 72px; bottom: 50px; font-family: sans-serif; font-size: 22px; color: #9fb8cc; }
.cast { position: absolute; right: 48px; top: 112px; width: 520px; display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 14px; }
.cast figure { position: relative; width: 160px; }
.cast img { display: block; width: 160px; height: 160px; object-fit: cover; border-radius: 20px; border: 2px solid rgba(79,216,255,0.35); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.cast figcaption { position: absolute; left: 10px; bottom: 8px; padding: 2px 10px; border-radius: 999px; background: rgba(6,13,22,0.85); font-size: 22px; color: #f5c542; }
.wrap > .eyebrow, .wrap > h1, .wrap > h2, .wrap > .sub { max-width: 560px; }
h1 { font-size: 136px !important; }
h2 { font-size: 46px !important; }
.sub { font-size: 26px !important; }
.foot { font-size: 19px !important; max-width: 560px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">TICKERVILLE</p>
  <h1>티커빌</h1>
  <h2>미국 기업 3D 지도</h2>
  <p class="sub">대통령이 되어 기업 보고를 받아보세요</p>
  <p class="foot">SEC 공시로 보는 실적과 재무 · 주가·시총 없음 · 투자 권유 아님</p>
  <div class="cast">
    <figure><img src="../../public/personas/washington.webp" alt=""><figcaption>1795</figcaption></figure>
    <figure><img src="../../public/personas/lincoln.webp" alt=""><figcaption>1863</figcaption></figure>
    <figure><img src="../../public/personas/t-roosevelt.webp" alt=""><figcaption>1905</figcaption></figure>
    <figure><img src="../../public/personas/fdr.webp" alt=""><figcaption>1935</figcaption></figure>
    <figure><img src="../../public/personas/analyst.webp" alt=""><figcaption>2026</figcaption></figure>
  </div>
</div>
</body>
</html>
