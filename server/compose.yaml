# 로컬 개발용 DB·캐시. `./gradlew bootRun` 하면 Spring Boot가 자동으로 띄운다 (Docker 필요)
services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=usstockmap'
      - 'POSTGRES_USER=usstockmap'
      - 'POSTGRES_PASSWORD=local-only'
    ports:
      - '5432:5432'
  redis:
    image: 'redis:7'
    ports:
      - '6379:6379'
